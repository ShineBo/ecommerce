syntax = "proto3";
package simple_shop.study_kit.v1;

// Shared contract for the optional plug-in. The backend remains the database owner.
service StudyKitPlugin {
  rpc GetInfo (InfoRequest) returns (PluginInfo);
  rpc CheckKit (CheckKitRequest) returns (CheckKitReply);
}
message InfoRequest {}
message KitPurpose {
  string id = 1;
  string name = 2;
  string description = 3;
}
message PluginInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  int32 api_version = 4;
  repeated KitPurpose purposes = 5;
  string algorithm_id = 6;
  string algorithm_name = 7;
  string algorithm_description = 8;
}
message CatalogItem {
  string product_id = 1;
  string sku = 2;
}
message CartItem {
  string product_id = 1;
  int32 quantity = 2;
}
message CheckKitRequest {
  string purpose_id = 1;
  int64 cart_version = 2;
  repeated CartItem cart_items = 3;
  // Only active catalog items are supplied. No prices, user data, or credentials are sent.
  repeated CatalogItem catalog_items = 4;
}
message KitRequirement {
  string id = 1;
  string label = 2;
  bool satisfied = 3;
  repeated string matched_product_ids = 4;
  repeated string suggested_product_ids = 5;
  int32 minimum_quantity = 6;
  int32 present_quantity = 7;
}
message CheckKitReply {
  string purpose_id = 1;
  string purpose_name = 2;
  int64 cart_version = 3;
  bool complete = 4;
  int32 completed_count = 5;
  int32 required_count = 6;
  repeated KitRequirement requirements = 7;
  string algorithm_id = 8;
  string algorithm_name = 9;
  string algorithm_description = 10;
}
